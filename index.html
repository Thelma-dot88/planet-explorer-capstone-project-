<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Planet Explorer</title>
      <link rel="stylesheet" href="style.css">
      </head>

      <body>
        <header>
        <div class="logo">
          <span>PLANET</span>
         </div>

       <button id="theme-toggle" type="button">
       <span>☾</span>
           DARK
      /button>

       <form id="search-form">
        <label for="search-input">Search planet name</label>
         <input
         type="text"
         id="search-input"
        placeholder="Search planet name"
        >
       <button type="submit">Search</button>
    </form>
  </header>
  <main>
      <section class="planet-section">
      <article class="planet-card">
         <img
          id="planet-image"
          src="https://anurella.github.io/images/planets/earth.jpg"
          alt="Earth">
      <div class="planet-info">
      <p id="planet-type">Terrestrial</p>

      <h1 id="planet-name">Earth</h1>
        <p id="planet-description" > 
    The only known planet to support life, with liquid water on its surface
       </p>

      <div class="planet-stats">
     <div class="stat">
    <span>Gravity</span>
  <strong id="planet-gravity">9.8</strong>
     </div>

     <div class="stat"> 
       <span>Mass</span>
       <strong id="planet-mass">0.00315</strong>
      </div>

     <div class="stat">
    <span>Period</span>
    <strong id="planet-period">365</strong>
   </div>

   <div class="stat">
  <span>Diameter</span> 
  <strong id="planet-diameter">12756</strong>
   </div>
    
   <div class="stat"> 
     <span>Moons</span>0
      <strong id="planet-moons">1</strong>
    </div>
   
   <div class="stat"> 
    <span>Distance</span> 
     <strong id="planet-distance">149.6</strong>
   </div>

 </div>

 </div>
   </article>
  </section>                                                                                                 
  </main>
    <script src="script.js"></script>
      </body>
      </html>
